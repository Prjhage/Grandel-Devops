name: Grandel CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── JOB 1: Install dependencies & basic checks ─────────────────────────────
  test:
    name: Install and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: Backend
        run: npm install

      - name: Run backend tests
        working-directory: Backend
        run: npm test || echo "No tests defined yet, skipping."

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint || echo "Lint warnings found, not blocking build."

  # ── JOB 2: Build Docker images & push to Docker Hub ────────────────────────
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grandel-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/grandel-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grandel-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/grandel-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 3: Deploy to EC2 ───────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy and restart Grandel on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Install Docker if not present
            if ! command -v docker &>/dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker ubuntu
            fi

            # Install docker compose plugin if not present
            if ! docker compose version &>/dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            # Prepare app directory
            mkdir -p /home/ubuntu/grandel
            cd /home/ubuntu/grandel

            # Write .env file from secret
            cat > .env << 'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF

            # Write docker-compose.yml using registry images
            cat > docker-compose.yml << 'COMPOSEEOF'
            services:
              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/grandel-frontend:latest
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: always

              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/grandel-backend:latest
                ports:
                  - "8080:8080"
                env_file:
                  - .env
                restart: always
            COMPOSEEOF

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/grandel-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/grandel-frontend:latest

            # Stop old containers and start fresh
            docker compose down --remove-orphans || true
            docker compose up -d

            # Clean up old images
            docker image prune -f

            echo "Grandel deployed successfully!"

  # ── JOB 4: Verify deployment ───────────────────────────────────────────────
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for services to start
        run: sleep 25

      - name: Check frontend is live
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "http://${{ secrets.EC2_HOST }}")
          echo "Frontend HTTP status: $STATUS"
          if [ "$STATUS" -eq 000 ]; then
            echo "FAILED: Frontend not reachable!"
            exit 1
          fi
          echo "Frontend is live!"

      - name: Check backend API is live
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "http://${{ secrets.EC2_HOST }}:8080")
          echo "Backend HTTP status: $STATUS"
          if [ "$STATUS" -eq 000 ]; then
            echo "FAILED: Backend API not reachable!"
            exit 1
          fi
          echo "Backend API is live!"

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "  Grandel deployed successfully!"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Actor   : ${{ github.actor }}"
          echo "  Time    : $(date -u)"
          echo "  Frontend: http://${{ secrets.EC2_HOST }}"
          echo "  Backend : http://${{ secrets.EC2_HOST }}:8080"
          echo "=========================================="
