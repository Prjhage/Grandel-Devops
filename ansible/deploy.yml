---
- name: Deploy Grandel on AWS EC2
  hosts: web
  become: yes

  vars:
    app_dir: /home/ubuntu/grandel

  tasks:

    # ── STEP 1: Update system packages ──
    - name: Update apt packages
      apt:
        update_cache: yes
        upgrade: yes

    # ── STEP 2: Install required dependencies ──
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
          - rsync
        state: present

    # ── STEP 3: Install Docker ──
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # ── STEP 4: Synchronize project code to server ──
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Synchronize project code to EC2 server
      synchronize:
        src: "../"
        dest: "{{ app_dir }}/"
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=.git"
          - "--exclude=.terraform"
          - "--exclude=*.tfstate*"
          - "--exclude=*.pem"

    # ── STEP 5: Copy backend.env file to server ──
    - name: Copy backend .env file
      copy:
        src: ../backend.env
        dest: "{{ app_dir }}/.env"
        mode: '0600'

    # ── STEP 6: Build and Start Docker containers ──
    - name: Stop any running containers
      command: docker compose down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    - name: Build Docker images
      command: docker compose build
      args:
        chdir: "{{ app_dir }}"

    - name: Start Grandel containers
      command: docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    # ── STEP 7: Verify containers are running ──
    - name: Check running containers
      command: docker ps
      register: docker_status

    - name: Print container status
      debug:
        msg: "{{ docker_status.stdout }}"
